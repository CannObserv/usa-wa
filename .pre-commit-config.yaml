# Generated code (the vendored OpenAPI client) is excluded from all hooks: it has
# its own pyproject.toml, so ruff would use that config root rather than ours.
exclude: ^packages/powermap-client/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Layering contracts (issue #189, AR-14). Same gate ruff runs in, because a
  # restructure nobody can check decays back within a few features — the cheapest
  # next move is always "import it from wherever it already is". `pass_filenames:
  # false` because import-linter analyses the whole workspace graph, not a file
  # list; `always_run` because a *new* import in an unstaged file can break a
  # contract just as well. Contracts + rationale live in the root pyproject.toml.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (layering contracts)
        entry: uv run --frozen --no-sync lint-imports
        language: system
        pass_filenames: false
        always_run: true

  # Static validation of deploy/ systemd units (issue #51). Assumes the VM's
  # env: verify resolves absolute ExecStart paths (/usr/local/bin/uv) and
  # User=exedev against the local box, so OFF-VM it can false-FAIL (not just
  # no-op) even with systemd-analyze present. No-ops only where systemd-analyze
  # is absent. The gate that matters runs on the single VM.
  - repo: local
    hooks:
      - id: systemd-verify-units
        name: systemd-analyze verify (deploy units)
        entry: scripts/verify-units.sh
        language: script
        files: ^deploy/.*\.(service|timer)$
