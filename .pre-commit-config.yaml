repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Layering contracts (issue #189, AR-14). Same gate ruff runs in, because a
  # restructure nobody can check decays back within a few features — the cheapest
  # next move is always "import it from wherever it already is". `pass_filenames:
  # false` because import-linter analyses the whole workspace graph, not a file
  # list; `always_run` because a *new* import in an unstaged file can break a
  # contract just as well. Contracts + rationale live in the root pyproject.toml.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (layering contracts)
        entry: uv run --frozen --no-sync lint-imports
        language: system
        pass_filenames: false
        always_run: true

  # SessionStart/PostToolUse hook wiring (issue #263). A Claude Code hook is two
  # artifacts — the script under .claude/hooks/ and the settings.json entry that
  # names it — and only the second makes it run. The first is the only one a
  # directory listing shows, so "installed, unregistered, never runs" is
  # invisible; the health hook #263 installed is silent when clean by design, so
  # an unwired copy and a healthy one are observationally identical.
  #
  # --check-only, not the bare invocation: the default warns and exits 0 so that
  # review preflights aren't hard-blocked by a defect outside the diff under
  # review, and a gate that reports damage then signals "fine" is no gate
  # (gregoryfoster/skills#231). always_run because the commit that REMOVES a
  # registration need not stage anything under .claude/. Pinned by
  # scripts/tests/test_hook_registration_gate.py.
  #
  # The default run FIRST, output discarded: --check-only also exits 1 on
  # uninitialized skills-vendor/ submodules, which is the state every `git
  # worktree add` produces and which AGENTS.md's worktree-per-feature rule makes
  # routine (verified: 0 vendor entries, rc=1 in a fresh worktree). The default
  # invocation self-heals exactly that, so healing first leaves the gate failing
  # only on the wiring gap it was added for. Its own exit code is ignored — a
  # failure to heal shows up as the probe's finding, in the probe's words.
  - repo: local
    hooks:
      - id: hook-registration
        name: doctor --check-only (hook wiring)
        entry: bash -c 'bash .skills/doctor.sh >/dev/null 2>&1; exec bash .skills/doctor.sh --check-only'
        language: system
        pass_filenames: false
        always_run: true

  # Static validation of deploy/ systemd units (issue #51). Assumes the VM's
  # env: verify resolves absolute ExecStart paths (/usr/local/bin/uv) and
  # User=exedev against the local box, so OFF-VM it can false-FAIL (not just
  # no-op) even with systemd-analyze present. No-ops only where systemd-analyze
  # is absent. The gate that matters runs on the single VM.
  - repo: local
    hooks:
      - id: systemd-verify-units
        name: systemd-analyze verify (deploy units)
        entry: scripts/verify-units.sh
        language: script
        files: ^deploy/.*\.(service|timer)$

  # dbt model import gate (issue #551). The models sit outside `src/`, so the
  # import-linter hook above never sees them; #535's tests graft them into the
  # graph (every contract) and scan their imports (declared dependencies), and
  # until #551 ran only in the suite — with no PR CI, a model edit committed
  # without pre-ship landed unchecked. Scoped to what can change those tests'
  # verdict on a model: the models, `model-paths`, the contracts (root
  # pyproject), any package's declarations, and the gate's own modules. `src/`
  # stays import-linter's for contracts and the suite's for declarations.
  # Measured ~2.7 s wall under pre-commit (#551) beside dbt-build's ~18 s on
  # the same commits; no shared state with it — both work
  # in temp dirs and neither writes under models/. --no-cov: neither coverage
  # gate measures a slice. pass_filenames: false, or pytest collects the staged
  # models as tests. Pinned by scripts/tests/test_dbt_model_imports.py.
  - repo: local
    hooks:
      - id: dbt-model-imports
        name: dbt model imports (contracts + declared dependencies)
        entry: uv run --frozen --no-sync pytest --no-cov -q -p no:cacheprovider scripts/tests/test_dbt_model_imports.py scripts/tests/test_declared_dependencies.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|packages/[^/]+/pyproject\.toml|packages/usa-wa-pipeline/dbt/(dbt_project\.yml|models/.*\.py)|scripts/tests/(dbt_models|test_dbt_model_imports|test_declared_dependencies)\.py)$

  # dbt pipeline gate (issue #303). `dbt build` on packages/usa-wa-pipeline/dbt
  # against a THROWAWAY duckdb: every model must compile and every schema/data
  # test must pass before a pipeline change lands. Scoped by `files` — the
  # pipeline evolves independently of the Python packages, so unrelated commits
  # don't pay the build. Pinned by scripts/tests/test_pipeline_gate.py.
  - repo: local
    hooks:
      - id: dbt-build
        name: dbt build (pipeline models + data tests)
        entry: scripts/dbt-gate.sh
        language: script
        pass_filenames: false
        files: ^packages/usa-wa-pipeline/
