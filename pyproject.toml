[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    # Workspace members (so a single `uv sync` installs everything in editable mode)
    "clearinghouse-core",
    "clearinghouse-domain-legislative",
    "clearinghouse-sync-powermap",
    "powermap-client",
    "usa-wa-adapter-legislature",
    "usa-wa-adapter-pdc",
    "usa-wa-adapter-sos",
    "usa-wa-api",
    "usa-wa-common",
    "usa-wa-facts-seats",
    "usa-wa-pipeline",
    "usa-wa-sync-powermap",
    # Tools
    "alembic>=1.15.0,<2",
    "anyio>=4.0,<5",
    "httpx>=0.27,<1",
    "pre-commit>=4.0,<5",
    # Read by scripts/tests/test_hook_registration_gate.py to parse
    # .pre-commit-config.yaml. Present transitively via pre-commit, but a gate
    # test must not depend on another package's dependency tree staying put.
    "pyyaml>=6.0,<7",
    "pytest>=8.0,<9",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6.0,<7",
    "respx>=0.21,<1",
    "ruff>=0.9,<1",
    "vcrpy>=7.0",
    "import-linter>=2.0,<3",
]

[tool.uv.sources]
clearinghouse-core = { workspace = true }
clearinghouse-domain-legislative = { workspace = true }
clearinghouse-sync-powermap = { workspace = true }
powermap-client = { workspace = true }
usa-wa-adapter-legislature = { workspace = true }
usa-wa-adapter-pdc = { workspace = true }
usa-wa-adapter-sos = { workspace = true }
usa-wa-api = { workspace = true }
usa-wa-common = { workspace = true }
usa-wa-facts-seats = { workspace = true }
usa-wa-pipeline = { workspace = true }
usa-wa-sync-powermap = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "scripts"]
addopts = "-v --tb=short -m 'not integration' --cov=packages --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests that hit live external services or a real database; excluded by default (run with -m integration)",
    "db: marks tests that need PostgreSQL; applied automatically to anything resolving the test_engine/db_session fixtures, and by hand where a test opens its own engine. The unit tier is `-m 'not db and not integration'` and needs no database (#185) — spell out both, since -m is last-wins against addopts and the bare `-m 'not db'` form silently re-enables the integration tier",
]
filterwarnings = [
    "error::DeprecationWarning",
]
# The unit tier's coverage profile (#198), applied by `conftest_coverage.py` whenever a
# run selects the whole workspace minus every `db`/`integration` test. Scope is a glob,
# never a module list: shipping code only (the ~1000 deselected test modules score zero
# and would swamp the total), and a module added tomorrow is measured tomorrow.
#
# 64 is measured, not chosen. At the commit that added it the tier covered 65.47% of
# `packages/*/src/**` (7205/11005 statements), against 95.75% for the full run — so the
# floor sits ~1.5pp low, about 160 statements of slack. Enough that one PR adding a
# DB-backed module does not fail an unrelated build; tight enough to notice a tier that
# stops exercising things. Ratchet it up as the number climbs; it is not an aspiration.
#
# Gating costs the tier its speed — instrumentation takes it from ~11s to ~27s — so
# `--no-cov` stays documented for the inner loop. It is the *gate* that had to stop
# needing a flag, not the loop.
#
# The integration tier (#216) gets the opposite call — an exemption, not a second
# floor. Its e2e test drives the refresh via subprocess.run, so the child's lines are
# invisible to coverage: a 3-test tier scored ~33% against the 80% floor and a fully
# green run exited 1. conftest_coverage.py zeroes the floor whenever a marker-only run
# selects nothing but integration-marked items (`-m integration`, or a narrowing of
# it); the report still prints, and an explicit --cov/--cov-fail-under on the command
# line still wins. The asymmetry with #198 is deliberate: the unit tier runs
# in-process, so its number means something; this tier's does not.
unit_cov_include = ["packages/*/src/**"]
unit_cov_fail_under = "64"

[tool.coverage.run]
source = ["packages"]
omit = [
    "packages/powermap-client/*",  # generated OpenAPI client; not our code to test
    # Declared-not-implemented tier (#182). These modules are pure table declarations
    # with no producer: every line executes on import, so they scored 100% and padded
    # the gate with code that never runs in anger. Their classes stay marked
    # IMPLEMENTATION_STATUS = "declared"; test_declared_tier.py keeps this list and the
    # markers in agreement, so wiring a module to a source forces its removal here.
    "packages/clearinghouse-domain-legislative/src/clearinghouse_domain_legislative/bills.py",
    "packages/clearinghouse-domain-legislative/src/clearinghouse_domain_legislative/pdc.py",
    "packages/clearinghouse-domain-legislative/src/clearinghouse_domain_legislative/statutes.py",
    "packages/clearinghouse-domain-legislative/src/clearinghouse_domain_legislative/votes.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["skills-vendor/", "alembic/versions/", ".superpowers/", "packages/powermap-client/"]

[tool.ruff.lint]
# ASYNC (flake8-async) and S (flake8-bandit) added by CR #191 finding 7: the job
# harness introduced a blocking subprocess call inside a coroutine that nothing could
# catch, and carried `# noqa: S603` suppressions for rules the project did not run.
select = ["E", "F", "I", "W", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 (`assert` used) is the whole point of a pytest test; flagging it in the test
# tree would be 3990 violations of nothing. Test code is not a deployment surface, so
# the rest of flake8-bandit is noise there too — S105/S106 fire on the fake tokens
# fixtures are built from. Kept fully enabled under src/, which is what ships.
"**/tests/*" = ["S", "ASYNC221"]

[tool.ruff.lint.isort]
known-first-party = [
    "clearinghouse_core",
    "clearinghouse_domain_legislative",
    "clearinghouse_sync_powermap",
    "powermap_client",
    "usa_wa_adapter_legislature",
    "usa_wa_adapter_pdc",
    "usa_wa_adapter_sos",
    "usa_wa_api",
    "usa_wa_common",
    "usa_wa_facts_seats",
    "usa_wa_pipeline",
    "usa_wa_sync_powermap",
]

# ---------------------------------------------------------------------------
# import-linter (#189, AR-14) — the layering, as an executable contract.
#
# AR-14's finding was not that the layers were wrong but that they were a *claim*:
# `docs/ARCHITECTURE.md` described a four-layer split while `usa-wa-adapter-sos`
# imported 21 symbols from two peer adapters and the PM sync sidecar imported a SOAP
# transport. A restructure nobody can check decays back to that within a few features,
# because the cheapest next move is always "import it from wherever it already is".
#
# Run: `uv run lint-imports`. Wired into the same gate ruff runs in
# (`.pre-commit-config.yaml`) and pinned by `scripts/tests/test_import_contracts.py`,
# which also proves the contracts *fire* rather than merely parse.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "clearinghouse_core",
    "clearinghouse_domain_legislative",
    "clearinghouse_sync_powermap",
    "usa_wa_common",
    "usa_wa_adapter_legislature",
    "usa_wa_adapter_pdc",
    "usa_wa_adapter_sos",
    "usa_wa_facts_seats",
    "usa_wa_pipeline",
    "usa_wa_api",
    "usa_wa_sync_powermap",
]
include_external_packages = false

[[tool.importlinter.contracts]]
# The spine. Higher layers may import lower ones; never the reverse.
name = "Layers: core < domain < common < adapter < facts < deployment"
type = "layers"
layers = [
    "usa_wa_api : usa_wa_sync_powermap",
    # facts and pipeline are independent siblings: both compose across adapters
    # (the pipeline's dbt Python models may import adapter parsers, never a
    # transport), neither may import the other (#302/#303).
    "usa_wa_facts_seats : usa_wa_pipeline",
    "usa_wa_adapter_legislature : usa_wa_adapter_pdc : usa_wa_adapter_sos",
    "usa_wa_common",
    "clearinghouse_domain_legislative : clearinghouse_sync_powermap",
    "clearinghouse_core",
]
# `clearinghouse_core.testing.reset_migration_schemas` function-locally imports the
# domain + sync packages so every declared schema is registered before it drops and
# recreates them. A deliberate inversion of the layer order, scoped to one test-support
# helper and already commented at the call site: it is *table registration*, not a
# dependency of Layer 1 on Layer 2. Named exactly (not wildcarded) so a second, real
# inversion in `clearinghouse_core` cannot hide behind it.
ignore_imports = [
    "clearinghouse_core.testing -> clearinghouse_domain_legislative.identity",
    "clearinghouse_core.testing -> clearinghouse_sync_powermap",
]

[[tool.importlinter.contracts]]
# The headline rule. One adapter package per jurisdiction+target, each a self-contained
# archive of one publisher's wire — so no adapter may reach into a peer. Composition
# across targets is what `usa_wa_facts_seats` is for.
name = "No adapter imports a peer adapter"
type = "independence"
modules = [
    "usa_wa_adapter_legislature",
    "usa_wa_adapter_pdc",
    "usa_wa_adapter_sos",
]

[[tool.importlinter.contracts]]
# A Layer-4 deployment package doing Layer-3 sourcing: the PM sync sidecar was making
# live SOAP calls to the Washington State Legislature from four reconcilers and a
# producer. A sync path depends on the *archive* (a cohort provider), never on a wire.
name = "Deployment packages never touch an adapter transport"
type = "forbidden"
# Direct imports only. A cohort provider *owns* a transport internally — that is the
# seam — so following the chain would forbid depending on a provider at all, which is
# the opposite of the rule. What must not happen is a deployment module naming the
# transport itself and driving the wire.
allow_indirect_imports = true
source_modules = ["usa_wa_sync_powermap", "usa_wa_api"]
forbidden_modules = [
    "usa_wa_adapter_legislature.transport",
    "usa_wa_adapter_pdc.transport",
    "usa_wa_adapter_sos.filings.transport",
    "usa_wa_adapter_sos.results.transport",
]

[[tool.importlinter.contracts]]
# Same rule one layer down: a fact composes cohort *interfaces*. Reaching for a
# transport re-welds the fact to a single source, which is the failure the 2026-07
# votewa outage taught (ARCHITECTURE.md § sourcing vs application).
name = "Facts depend on cohort interfaces, never on a transport"
type = "forbidden"
allow_indirect_imports = true  # as above: a provider legitimately owns its transport
# usa_wa_pipeline sits under the same rule (#303): its staging models re-parse
# the *archive* (raw/ files) through adapter parse functions; driving a wire
# from a dbt model would put a harvest inside a transform.
source_modules = ["usa_wa_facts_seats", "usa_wa_pipeline"]
forbidden_modules = [
    "usa_wa_adapter_legislature.transport",
    "usa_wa_adapter_pdc.transport",
    "usa_wa_adapter_sos.filings.transport",
    "usa_wa_adapter_sos.results.transport",
]
# NO EXCEPTIONS (#201). #189 granted two — the daily drivers each ran a source's Phase-A
# harvest and then rebuilt the fact from the resulting archive — and #201 split them:
# each adapter owns "refresh my archive" (`…results.archive_refresh`,
# `…pdc.archive_refresh`, their own units), the fact owns "rebuild from the archive".
# Kept exception-free by `scripts/tests/test_import_contracts.py`.

[[tool.importlinter.contracts]]
# `usa-wa-common` is vocabulary: what is true about Washington's legislature, not about
# any publisher of data on it. The moment it can import an adapter it stops being that
# and becomes a second shared kernel — which is exactly how the first one formed.
name = "usa-wa-common is source-free"
type = "forbidden"
source_modules = ["usa_wa_common"]
forbidden_modules = [
    "usa_wa_adapter_legislature",
    "usa_wa_adapter_pdc",
    "usa_wa_adapter_sos",
    "usa_wa_facts_seats",
    "usa_wa_sync_powermap",
    "usa_wa_api",
]
