[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    # Workspace members (so a single `uv sync` installs everything in editable mode)
    "clearinghouse-core",
    "clearinghouse-domain-legislative",
    "clearinghouse-sync-powermap",
    "powermap-client",
    "usa-wa-adapter-legislature",
    "usa-wa-adapter-pdc",
    "usa-wa-adapter-sos",
    "usa-wa-api",
    "usa-wa-sync-powermap",
    # Tools
    "alembic>=1.15.0,<2",
    "anyio>=4.0,<5",
    "httpx>=0.27,<1",
    "pre-commit>=4.0,<5",
    "pytest>=8.0,<9",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6.0,<7",
    "respx>=0.21,<1",
    "ruff>=0.9,<1",
    "vcrpy>=7.0",
]

[tool.uv.sources]
clearinghouse-core = { workspace = true }
clearinghouse-domain-legislative = { workspace = true }
clearinghouse-sync-powermap = { workspace = true }
powermap-client = { workspace = true }
usa-wa-adapter-legislature = { workspace = true }
usa-wa-adapter-pdc = { workspace = true }
usa-wa-adapter-sos = { workspace = true }
usa-wa-api = { workspace = true }
usa-wa-sync-powermap = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "scripts"]
addopts = "-v --tb=short -m 'not integration' --cov=packages --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests that hit live external services or a real database; excluded by default (run with -m integration)",
]
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.coverage.run]
source = ["packages"]
omit = [
    "packages/powermap-client/*",  # generated OpenAPI client; not our code to test
    # Declared-not-implemented tier (#182). These modules are pure table declarations
    # with no producer: every line executes on import, so they scored 100% and padded
    # the gate with code that never runs in anger. Their classes stay marked
    # IMPLEMENTATION_STATUS = "declared"; test_declared_tier.py keeps this list and the
    # markers in agreement, so wiring a module to a source forces its removal here.
    "packages/clearinghouse-domain-legislative/src/clearinghouse_domain_legislative/bills.py",
    "packages/clearinghouse-domain-legislative/src/clearinghouse_domain_legislative/pdc.py",
    "packages/clearinghouse-domain-legislative/src/clearinghouse_domain_legislative/statutes.py",
    "packages/clearinghouse-domain-legislative/src/clearinghouse_domain_legislative/votes.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["skills-vendor/", "alembic/versions/", ".superpowers/", "packages/powermap-client/"]

[tool.ruff.lint]
# ASYNC (flake8-async) and S (flake8-bandit) added by CR #191 finding 7: the job
# harness introduced a blocking subprocess call inside a coroutine that nothing could
# catch, and carried `# noqa: S603` suppressions for rules the project did not run.
select = ["E", "F", "I", "W", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 (`assert` used) is the whole point of a pytest test; flagging it in the test
# tree would be 3990 violations of nothing. Test code is not a deployment surface, so
# the rest of flake8-bandit is noise there too — S105/S106 fire on the fake tokens
# fixtures are built from. Kept fully enabled under src/, which is what ships.
"**/tests/*" = ["S", "ASYNC221"]

[tool.ruff.lint.isort]
known-first-party = [
    "clearinghouse_core",
    "clearinghouse_domain_legislative",
    "clearinghouse_sync_powermap",
    "powermap_client",
    "usa_wa_adapter_legislature",
    "usa_wa_adapter_pdc",
    "usa_wa_adapter_sos",
    "usa_wa_api",
    "usa_wa_sync_powermap",
]
