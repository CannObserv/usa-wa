[project]
name = "usa-wa-api"
version = "0.1.0"
description = "WA deployment of the CannObserv clearinghouse — FastAPI + MCP + REST + admin surface backed by the WA Legislature, PDC, and RCW adapters."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clearinghouse-core",
    "clearinghouse-domain-legislative",
    "fastapi>=0.115.0,<1",
    # The nightly backup's create-only writer and the restore's reader (#434).
    "google-cloud-storage>=2,<4",
    # The backup's dead-man check-in to co-status (#455).
    "httpx>=0.27,<1",
    "uvicorn>=0.34.0,<1",
]

[tool.uv.sources]
clearinghouse-core = { workspace = true }
clearinghouse-domain-legislative = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usa_wa_api"]
