[project]
name = "usa-wa-facts-seats"
version = "0.1.0"
description = "Layer 3b (#189, AR-14): the WA legislative-seat FACTS — House Position (WSL roster x SOS ballot), Senate corroboration, and the PDC winner spans/identifiers. Composes cohort providers across adapters; the composition layer the four-layer model lacked."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clearinghouse-core",
    "clearinghouse-domain-legislative",
    "usa-wa-common",
    "usa-wa-adapter-legislature",
    "usa-wa-adapter-pdc",
    "usa-wa-adapter-sos",
]

[tool.uv.sources]
clearinghouse-core = { workspace = true }
clearinghouse-domain-legislative = { workspace = true }
usa-wa-common = { workspace = true }
usa-wa-adapter-legislature = { workspace = true }
usa-wa-adapter-pdc = { workspace = true }
usa-wa-adapter-sos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usa_wa_facts_seats"]
