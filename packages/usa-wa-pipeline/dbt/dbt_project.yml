# The dataset-publication pipeline (#302/#303). Three layers per the replatform
# spec (docs/specs/2026-09-02-dataset-publication-replatform-design.md):
# staging (per-source cleaning, natural keys only), matching (cross-source link
# proposals feeding the registrar), conformed (registry-joined products).
# Python models materialize as tables (dbt-duckdb cannot view-materialize
# them); the matching SQL rule models stay views over staging tables.
# External CSV/Parquet materialization is the spec's end state.
name: usa_wa_pipeline
version: "0.1.0"
profile: usa_wa_pipeline

model-paths: ["models"]
test-paths: ["tests"]

models:
  usa_wa_pipeline:
    staging:
      +materialized: table
    matching:
      +materialized: view
    conformed:
      +materialized: table
