# conformed layer: registry-joined products with stable ULIDs (replatform
# spec § Target architecture). Crosswalks carry the merge tombstones — the
# only re-point signal a consumer gets. Assignments are the span engine as a
# Python model (#309); roles/seats complete this layer.
version: 2

models:
  - name: person_crosswalk
    description: Every person natural key → entity ULID (+ merged_into tombstone).
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: natural_key
        data_tests: [not_null, unique]
  - name: org_crosswalk
    description: Every org natural key → entity ULID (+ merged_into tombstone).
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: natural_key
        data_tests: [not_null, unique]
  - name: persons
    description: One row per LIVE person entity; name survivorship roster > WSL > PDC.
    columns:
      - name: entity_id
        data_tests: [not_null, unique]
  - name: organizations
    description: One row per LIVE org entity; newest-biennium committee attributes.
    columns:
      - name: entity_id
        data_tests: [not_null, unique]
  - name: assignments
    description: "Merged tenure spans joined to the person crosswalk; the span source_id's parts as real columns (#309). Two families in disjoint identity spaces — the WSL archive (numeric member ids, 1991-) and the roster PDF (minted <fold>:<year> identities, pre-1991) — so `source` names which space `member_id` belongs to. All four kinds: party, chamber-senate, committee, and chamber-house (the WSL roster x SOS ballot join)."
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: member_id
        data_tests: [not_null]
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["usa_wa_legislature", "usa_wa_legislature_roster"]
      - name: span_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["party", "chamber-senate", "committee", "chamber-house"]
      - name: span_discriminator
        data_tests: [not_null]
      - name: span_start_biennium
        data_tests: [not_null]
      - name: role_key
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
  - name: roles
    description: "The seat/slot dimension the assignments name (#309). role_key is a DETERMINISTIC structural key — a pure function of the seat, identical on every run and aligned 1:1 with Power Map's seat match key. Since #313 a role also carries entity_id, its registry ULID: the API needs a stable handle when the derived key moves, and PM already holds 312 role anchors. Both are published; the key is never mediated away. entity_id is nullable for one run only — the nightly registers after the build."
    columns:
      - name: entity_id
        data_tests: [unique]
      - name: role_key
        data_tests: [not_null, unique]
      - name: role_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["party_member", "committee_member", "state_senator", "state_representative"]
      - name: org_source_id
        data_tests: [not_null]
  - name: citations
    description: "Every published entity → the raw wires that attest it (#313). Internal tier: loaded into the serving schema so /provenance/{type}/{id} keeps answering after the Postgres provenance tables retire, but not part of the subscriber contract. entity_id is a registry ULID for person/organization/role and a 4-part span source_id for assignment, which is the assignment's published identity. Joins stg_raw_fetches on (source, resource_id) for the digest, fetch time and URL — none of which is duplicated here."
    columns:
      - name: entity_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["person", "organization", "role", "assignment"]
      - name: entity_id
        data_tests: [not_null]
      - name: source
        data_tests: [not_null]
      - name: resource_id
        data_tests: [not_null]
