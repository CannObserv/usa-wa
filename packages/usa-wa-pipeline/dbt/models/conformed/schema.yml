# conformed layer: registry-joined products with stable ULIDs (replatform
# spec § Target architecture). Crosswalks carry the merge tombstones — the
# only re-point signal a consumer gets. Assignments are the span engine as a
# Python model (#309); roles/seats complete this layer.
version: 2

models:
  - name: person_crosswalk
    description: Every person natural key → entity ULID (+ merged_into tombstone).
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: natural_key
        data_tests: [not_null, unique]
  - name: org_crosswalk
    description: Every org natural key → entity ULID (+ merged_into tombstone).
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: natural_key
        data_tests: [not_null, unique]
  - name: persons
    description: One row per LIVE person entity; name survivorship roster > WSL > PDC.
    columns:
      - name: entity_id
        data_tests: [not_null, unique]
  - name: organizations
    description: One row per LIVE org entity; newest-biennium committee attributes.
    columns:
      - name: entity_id
        data_tests: [not_null, unique]
  - name: assignments
    description: Merged tenure spans joined to the person crosswalk; the span source_id's parts as real columns (#309). Two families in disjoint identity spaces — the WSL archive (numeric member ids, 1991-) and the roster PDF (minted <fold>:<year> identities, pre-1991) — so `source` names which space `member_id` belongs to. chamber-house arrives with the facts-seats port.
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: member_id
        data_tests: [not_null]
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["usa_wa_legislature", "usa_wa_legislature_roster"]
      - name: span_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["party", "chamber-senate", "committee"]
      - name: span_discriminator
        data_tests: [not_null]
      - name: span_start_biennium
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
