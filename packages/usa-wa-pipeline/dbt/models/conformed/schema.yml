# conformed layer: registry-joined products with stable ULIDs (replatform
# spec § Target architecture). Crosswalks carry the merge tombstones — the
# only re-point signal a consumer gets. Roles/seats + assignments (the span
# engine as Python models) complete this layer later in #309.
version: 2

models:
  - name: person_crosswalk
    description: Every person natural key → entity ULID (+ merged_into tombstone).
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: natural_key
        data_tests: [not_null, unique]
  - name: org_crosswalk
    description: Every org natural key → entity ULID (+ merged_into tombstone).
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: natural_key
        data_tests: [not_null, unique]
  - name: persons
    description: One row per LIVE person entity; name survivorship roster > WSL > PDC.
    columns:
      - name: entity_id
        data_tests: [not_null, unique]
  - name: organizations
    description: One row per LIVE org entity; newest-biennium committee attributes.
    columns:
      - name: entity_id
        data_tests: [not_null, unique]
  - name: assignments
    description: Merged tenure spans (party, Senate seat, committee membership) joined to the person crosswalk; the 4-part span source_id as real columns (#309). chamber-house arrives with the facts-seats port.
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: member_id
        data_tests: [not_null]
      - name: span_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["party", "chamber-senate", "committee"]
      - name: span_discriminator
        data_tests: [not_null]
      - name: span_start_biennium
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
