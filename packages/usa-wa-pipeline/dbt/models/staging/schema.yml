# staging layer: one cleaning regime per source, NATURAL KEYS ONLY — no ULIDs,
# no cross-source joins (replatform spec § Target architecture). Composite-key
# uniqueness lives in the singular tests under tests/ (one file per key).
version: 2

models:
  - name: stg_wsl_committees
    description: One row per (biennium, committee) from the newest committees-roster wire.
    columns:
      - name: biennium
        data_tests: [not_null]
      - name: committee_id
        data_tests: [not_null]
      - name: agency
        data_tests: [not_null]
  - name: stg_wsl_sponsors
    description: One row per (biennium, member, agency) — a chamber move lists both agencies.
    columns:
      - name: biennium
        data_tests: [not_null]
      - name: member_id
        data_tests: [not_null]
  - name: stg_wsl_committee_members
    description: One row per (biennium, committee, member, honorific) — chamber movers list twice (see tests/); committee key rides the resource id (#82).
    columns:
      - name: biennium
        data_tests: [not_null]
      - name: committee_id
        data_tests: [not_null]
      - name: member_id
        data_tests: [not_null]
  - name: stg_wsl_meetings
    description: One row per (window, meeting, committee ref) — duplicates across meetings are the source's truth; dedup is downstream policy.
    columns:
      - name: meeting_window
        data_tests: [not_null]
      - name: committee_id
        data_tests: [not_null]
  - name: stg_roster_members
    description: Member-year rows from the newest roster-PDF revision; order is seat-lineage order (#229).
    columns:
      - name: year
        data_tests: [not_null]
      - name: district
        data_tests: [not_null]
      - name: chamber
        data_tests: [not_null]
      - name: name
        data_tests: [not_null]
  - name: stg_pdc_winners
    description: One row per (chamber, election_year, filer) from the archived SODA winner cohorts (#307).
    columns:
      - name: chamber
        data_tests: [not_null]
      - name: election_year
        data_tests: [not_null]
      - name: filer_id
        data_tests: [not_null]
  - name: stg_sos_results
    description: One row per (election, race, candidate) from the archived results exports (#307).
    columns:
      - name: election_date
        data_tests: [not_null]
      - name: race
        data_tests: [not_null]
      - name: candidate
        data_tests: [not_null]
  - name: stg_sos_filings
    description: One row per (election, race, filed candidate) from the archived WhoFiled exports (#307). Store empty until the raw harvest runs (the Postgres archive held no filings payloads to export).
    columns:
      - name: election_date
        data_tests: [not_null]
      - name: ballot_name
        data_tests: [not_null]
  - name: stg_raw_fetches
    description: "The raw attestation dimension (#313): one row per (source, resource_id) — the newest ok fetch, its sha256 and fetch time from latest.json, its URL and byte count from the run manifest that recorded it. Sources are DISCOVERED from the raw root, not configured, so a source added to the harvest chain cannot silently publish uncitable entities. url/bytes are null when the manifest has been pruned; sha256 never is."
    columns:
      - name: source
        data_tests: [not_null]
      - name: resource_id
        data_tests: [not_null]
      - name: sha256
        data_tests: [not_null]
      - name: fetched_at
        data_tests: [not_null]
