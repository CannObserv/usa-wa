[project]
name = "usa-wa-common"
version = "0.1.0"
description = "Washington-State legislative vocabulary, source-free (#189, AR-14): the general-election calendar, seat/position keying, name folding, party canonicalization and the ballot interfaces. Layer 2b — above the domain model, below every usa-wa adapter. Imports no adapter and speaks no wire."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clearinghouse-core",
    "clearinghouse-domain-legislative",
]

[tool.uv.sources]
clearinghouse-core = { workspace = true }
clearinghouse-domain-legislative = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usa_wa_common"]
