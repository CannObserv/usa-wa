# usa-wa#389 — memory-pressure tuning for a 7.7 GiB host with no swap that runs
# a production service alongside interactive agent sessions.
#
# The kernel's atomic-allocation reserve. Past the memory ceiling with no swap,
# the failure is not an OOM kill: allocations that cannot sleep fail in unrelated
# processes (tailscaled, ksoftirqd) while nothing is killed at all. That is how
# CannObserv/broker's 2026-09-16 outage presented — the bus was effectively down
# 57m 48s (gregoryfoster/skills#295). A larger reserve buys the kernel room to
# satisfy those without reclaiming first.
#
# Default here was 11399 (~11 MiB). 64 MiB on 7.7 GiB is ~0.8% of RAM.
#
# Install: sudo cp deploy/sysctl.d/60-usa-wa-memory.conf /etc/sysctl.d/ && sudo sysctl --system
# Verify:  sysctl vm.min_free_kbytes
vm.min_free_kbytes = 65536
