# The canonical disk GC's failure net (#508): mail the operator through the #49
# chain when cannobserv-disk-gc.service fails (exit 1 or 2, or its 1800 s
# timeout), as usa-wa-disk-gc.service did before it retired.
#
# The unit is the image layer's (CannObserv/provisioner#61), installed under
# /usr/local/lib and never edited here: a drop-in under /etc leaves it, and the
# layer's MANIFEST, untouched (maintaining-host-disk turning-on.md § 5, close (a)).
# The headroom sensor's gc-failed page on co-status is the second notice.
#
# Install: sudo install -D -m 0644 deploy/cannobserv-disk-gc.service.d/on-failure.conf \
#            /etc/systemd/system/cannobserv-disk-gc.service.d/on-failure.conf
#          sudo systemctl daemon-reload
[Unit]
OnFailure=usa-wa-notify-failure@%n.service
