# Cap the systemd journal (usa-wa #394).
#
# /etc/systemd/journald.conf sets no SystemMaxUse=, so the journal grows to
# journald's built-in default — 10% of the filesystem, i.e. ~2.5 G on this 25 G
# volume, and it had drifted to 695 M before #394 vacuumed it by hand. A vacuum
# is a one-off; this is the cap that makes it not recur. No disk GC vacuums.
#
# 200 M holds weeks of this deployment's volume — the units are timer-driven
# oneshots logging a few hundred JSON records a day, plus uvicorn access lines.
#
# Named after the canonical disk GC's own drop-in (#508), which ships
# /usr/local/lib/systemd/journald.conf.d/zz-cannobserv-journal.conf at 512M.
# journald applies drop-ins in file-name order across directories, so any other
# name sorts before zz- and loses; this name under /etc masks the layer's file.
#
# Install: sudo cp deploy/journald.conf.d/zz-cannobserv-journal.conf \
#            /etc/systemd/journald.conf.d/ && sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=200M
