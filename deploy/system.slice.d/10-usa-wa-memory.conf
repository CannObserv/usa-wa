# Parent memory protection for every prod unit (CR 1 on #389).
#
# WHY THIS FILE EXISTS. `usa-wa.service` sets `MemoryLow=256M`, and on its own
# that reserves NOTHING. In cgroup v2 a cgroup's effective `memory.low` is capped
# by its ancestors' — a child can only draw on protection its parent holds — and
# measured on this host 2026-09-19:
#
#   /sys/fs/cgroup/system.slice/memory.low   = 0
#   systemctl show system.slice -p MemoryLow → 0
#   DefaultMemoryLow                           unset in system.conf
#   cgroup2 mount options                      rw,relatime (no memory_recursiveprot)
#
# So the serving unit's effective protection was min(256M, 0) = 0, while the unit
# comment and docs/DEPLOYMENT.md both said it was protected. A protection that
# reports itself active and does nothing is worse than an absent one; this is the
# half that makes the other half real.
#
# SIZING. 1G against a slice whose live usage is ~1.4G: enough to cover
# usa-wa.service's 256M with room for postgresql and the oneshot timers beneath
# it, and deliberately BELOW current usage so it reads as a floor rather than a
# ceiling. `MemoryLow=` is best-effort protection from reclaim, never a limit —
# systemd refuses no allocation because of it, and a slice over its low is simply
# reclaimable down to it.
#
# The competitor is user.slice, which carries no protection: an interactive agent
# session and the MCP servers it launches. That asymmetry is the point.
#
# Install: sudo mkdir -p /etc/systemd/system/system.slice.d && \
#          sudo cp deploy/system.slice.d/10-usa-wa-memory.conf /etc/systemd/system/system.slice.d/ && \
#          sudo systemctl daemon-reload
# Verify:  cat /sys/fs/cgroup/system.slice/memory.low   # 1073741824, not 0
[Slice]
MemoryLow=1G
